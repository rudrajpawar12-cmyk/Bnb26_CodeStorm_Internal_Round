name: Quorum Verification

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Public GitHub repository to verify (owner/repo)"
        required: true
        type: string
      commit:
        description: "Exact immutable commit SHA to verify"
        required: true
        type: string
      node_version:
        description: "Node.js runtime version"
        required: false
        default: "22"
        type: string
      install_command:
        description: "Dependency install command"
        required: false
        default: "npm ci || npm install"
        type: string
      build_command:
        description: "Build compilation command"
        required: false
        default: "npm run build"
        type: string
      artifact_path:
        description: "Output directory or path to verify"
        required: false
        default: "dist"
        type: string
      demo_conflict:
        description: "Enable Demo Conflict Mode (tamper Builder C after build)"
        required: false
        default: "false"
        type: string

# Security Controls: Read-only checkout permissions, no write access, no token leakage
permissions:
  contents: read

jobs:
  builder-a:
    name: Builder A (Isolated Runner 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target repository at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies reproducibly
        run: ${{ inputs.install_command }}

      - name: Compile release from source
        run: ${{ inputs.build_command }}

      - name: Calculate canonical artifact fingerprint
        id: hash
        shell: bash
        run: |
          TARGET="${{ inputs.artifact_path }}"
          if [ ! -d "$TARGET" ] || [ -z "$(find "$TARGET" -type f 2>/dev/null)" ]; then
            echo "BUILD FAILED: Target artifact directory '$TARGET' does not exist or contains no files after build!"
            exit 1
          fi

          find "$TARGET" -type f | LC_ALL=C sort | xargs -r sha256sum > canonical-manifest-a.txt
          HASH=$(sha256sum canonical-manifest-a.txt | awk '{print $1}')
          echo "BUILDER_A_HASH=$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Save Builder A result
        shell: bash
        run: |
          cat <<EOF > quorum-result.json
          {
            "builder": "Builder A",
            "commit": "${{ inputs.commit }}",
            "status": "success",
            "artifactHash": "${{ steps.hash.outputs.hash }}",
            "buildCommand": "${{ inputs.build_command }}",
            "artifactPath": "${{ inputs.artifact_path }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "runner": "GitHub-hosted isolated runner (Ubuntu 24.04)"
          }
          EOF

      - name: Upload Builder A result
        uses: actions/upload-artifact@v4
        with:
          name: builder-a-result
          path: quorum-result.json

  builder-b:
    name: Builder B (Isolated Runner 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target repository at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies reproducibly
        run: ${{ inputs.install_command }}

      - name: Compile release from source
        run: ${{ inputs.build_command }}

      - name: Calculate canonical artifact fingerprint
        id: hash
        shell: bash
        run: |
          TARGET="${{ inputs.artifact_path }}"
          if [ ! -d "$TARGET" ] || [ -z "$(find "$TARGET" -type f 2>/dev/null)" ]; then
            echo "BUILD FAILED: Target artifact directory '$TARGET' does not exist or contains no files after build!"
            exit 1
          fi

          find "$TARGET" -type f | LC_ALL=C sort | xargs -r sha256sum > canonical-manifest-b.txt
          HASH=$(sha256sum canonical-manifest-b.txt | awk '{print $1}')
          echo "BUILDER_B_HASH=$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Save Builder B result
        shell: bash
        run: |
          cat <<EOF > quorum-result.json
          {
            "builder": "Builder B",
            "commit": "${{ inputs.commit }}",
            "status": "success",
            "artifactHash": "${{ steps.hash.outputs.hash }}",
            "buildCommand": "${{ inputs.build_command }}",
            "artifactPath": "${{ inputs.artifact_path }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "runner": "GitHub-hosted isolated runner (Ubuntu 22.04)"
          }
          EOF

      - name: Upload Builder B result
        uses: actions/upload-artifact@v4
        with:
          name: builder-b-result
          path: quorum-result.json

  builder-c:
    name: Builder C (Isolated Runner 3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target repository at exact commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies reproducibly
        run: ${{ inputs.install_command }}

      - name: Compile release from source
        run: ${{ inputs.build_command }}

      - name: Simulate Builder Conflict (Demo Mode only)
        if: ${{ inputs.demo_conflict == 'true' }}
        shell: bash
        run: |
          TARGET="${{ inputs.artifact_path }}"
          echo "DEMO CONFLICT: Intentionally injecting tamper signature into Builder C artifact..."
          FIRST_FILE=$(find "$TARGET" -type f 2>/dev/null | head -n 1)
          if [ -n "$FIRST_FILE" ]; then
            echo "QUORUM DEMO TAMPER" >> "$FIRST_FILE"
            echo "Tampered: $FIRST_FILE"
          else
            echo "QUORUM DEMO TAMPER" > "$TARGET/tamper.sig"
          fi

      - name: Calculate canonical artifact fingerprint
        id: hash
        shell: bash
        run: |
          TARGET="${{ inputs.artifact_path }}"
          if [ ! -d "$TARGET" ] || [ -z "$(find "$TARGET" -type f 2>/dev/null)" ]; then
            echo "BUILD FAILED: Target artifact directory '$TARGET' does not exist or contains no files after build!"
            exit 1
          fi

          find "$TARGET" -type f | LC_ALL=C sort | xargs -r sha256sum > canonical-manifest-c.txt
          HASH=$(sha256sum canonical-manifest-c.txt | awk '{print $1}')
          echo "BUILDER_C_HASH=$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Save Builder C result
        shell: bash
        run: |
          cat <<EOF > quorum-result.json
          {
            "builder": "Builder C",
            "commit": "${{ inputs.commit }}",
            "status": "success",
            "artifactHash": "${{ steps.hash.outputs.hash }}",
            "buildCommand": "${{ inputs.build_command }}",
            "artifactPath": "${{ inputs.artifact_path }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "runner": "GitHub-hosted isolated runner (Ubuntu 24.04)"
          }
          EOF

      - name: Upload Builder C result
        uses: actions/upload-artifact@v4
        with:
          name: builder-c-result
          path: quorum-result.json

  quorum:
    name: Quorum Consensus Engine
    runs-on: ubuntu-latest
    needs:
      - builder-a
      - builder-b
      - builder-c
    steps:
      - name: Download Builder A
        uses: actions/download-artifact@v4
        with:
          name: builder-a-result
          path: a-result

      - name: Download Builder B
        uses: actions/download-artifact@v4
        with:
          name: builder-b-result
          path: b-result

      - name: Download Builder C
        uses: actions/download-artifact@v4
        with:
          name: builder-c-result
          path: c-result

      - name: Aggregate builder fingerprints
        shell: bash
        run: |
          HASH_A=$(cat a-result/quorum-result.json | python3 -c "import sys,json; print(json.load(sys.stdin)['artifactHash'])")
          HASH_B=$(cat b-result/quorum-result.json | python3 -c "import sys,json; print(json.load(sys.stdin)['artifactHash'])")
          HASH_C=$(cat c-result/quorum-result.json | python3 -c "import sys,json; print(json.load(sys.stdin)['artifactHash'])")

          echo "=========================================="
          echo "BUILDER A HASH = $HASH_A"
          echo "BUILDER B HASH = $HASH_B"
          echo "BUILDER C HASH = $HASH_C"
          echo "=========================================="

          if [ "$HASH_A" = "$HASH_B" ] && [ "$HASH_B" = "$HASH_C" ]; then
            echo "🟢 QUORUM VERIFIED"
            RESULT="VERIFIED"
            CONSENSUS="3/3"
            MATCH=true
          elif [ "$HASH_A" = "$HASH_B" ] || [ "$HASH_B" = "$HASH_C" ] || [ "$HASH_A" = "$HASH_C" ]; then
            echo "🟡 VERIFICATION CONFLICT"
            RESULT="VERIFICATION_CONFLICT"
            CONSENSUS="2/3"
            MATCH=false
          else
            echo "🟠 NO CONSENSUS"
            RESULT="NO_CONSENSUS"
            CONSENSUS="0/3"
            MATCH=false
          fi

          cat <<EOF > quorum-summary.json
          {
            "result": "$RESULT",
            "consensus": "$CONSENSUS",
            "match": $MATCH,
            "hashA": "$HASH_A",
            "hashB": "$HASH_B",
            "hashC": "$HASH_C",
            "verifiedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload Quorum Summary
        uses: actions/upload-artifact@v4
        with:
          name: quorum-summary
          path: quorum-summary.json